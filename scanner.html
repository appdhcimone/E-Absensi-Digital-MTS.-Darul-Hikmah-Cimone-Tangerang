<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Scanner QR — E-Absensi MTs Darul Hikmah Cimone</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f8fafc;background:#07111f}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at top,#172b48,#07111f 70%);display:flex;flex-direction:column;align-items:center;gap:12px}.head,.status,.videoWrap,.actions,.tip{width:100%;max-width:860px}.head{text-align:center;padding:8px 0}.head h1{font-size:clamp(18px,4vw,24px);margin:0 0 5px}.head p{margin:0;color:#a5b4fc;font-size:13px}.status{border:1px solid #334155;background:#111e31;border-radius:14px;padding:12px;text-align:center;font-size:14px;line-height:1.45;min-height:46px}.status.ok{background:#064e3b;border-color:#059669;color:#d1fae5}.status.err{background:#7f1d1d;border-color:#ef4444;color:#fee2e2}.videoWrap{position:relative;background:#000;border:1px solid #334155;border-radius:18px;overflow:hidden;min-height:250px;box-shadow:0 12px 36px #0006}.videoWrap video{display:block;width:100%;height:auto;max-height:72vh;min-height:250px;object-fit:contain;background:#000}.aim{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.aimBox{width:min(62vw,310px);height:min(62vw,310px);max-height:45vh;border:3px solid #4ade80;border-radius:18px;box-shadow:0 0 0 9999px #0002}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:130px;border:0;border-radius:12px;padding:13px 12px;font-weight:800;font-size:14px;color:white;background:#4f46e5}.actions button.secondary{background:#26354a}.actions button:disabled{opacity:.45}.tip{font-size:12px;line-height:1.6;text-align:center;color:#b6c2d4}.hide{display:none!important}
</style>
</head>
<body>
<header class="head"><h1>📷 Scanner QR Absensi</h1><p id="modeLabel">E-Absensi MTs Darul Hikmah Cimone</p></header>
<div id="status" class="status">Tekan “Buka Kamera” untuk mulai memindai.</div>
<div class="videoWrap"><video id="video" autoplay playsinline muted></video><canvas id="canvas" hidden></canvas><div class="aim"><div class="aimBox"></div></div></div>
<div class="actions"><button id="startBtn">📷 Buka Kamera</button><button id="switchBtn" class="secondary">🔄 Ganti Kamera</button><button id="doneBtn" class="secondary">✓ Selesai</button></div>
<div id="tip" class="tip">Halaman kamera berjalan terpisah dari Apps Script agar izin kamera browser dapat digunakan. Buka scanner dari menu absensi utama agar hasil scan dikirim kembali dengan benar.</div>
<script>
(function(){
'use strict';
var params=new URLSearchParams(location.search);
var flow=params.get('flow')||'collective';
var attendanceMode=params.get('attendanceMode')||'masuk';
var kelas=params.get('kelas')||'SEMUA';
var video=document.getElementById('video'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true});
var statusEl=document.getElementById('status'), tipEl=document.getElementById('tip');
var stream=null, facing='environment', decoder=null, timer=null, busy=false, closed=false, lastScanAt=0, recent=Object.create(null), jsqrLoading=false;
document.getElementById('modeLabel').textContent=flow==='dh'?('Daftar Hadir · '+(attendanceMode==='pulang'?'Absen Pulang':'Absen Masuk')+' · Kelas '+kelas):'Scan QR kolektif · Siswa';
function status(msg,type){statusEl.textContent=msg;statusEl.className='status'+(type?' '+type:'');}
function sendToParent(obj){try{if(window.opener&&!window.opener.closed){window.opener.postMessage(obj,'*');return true;}}catch(e){}return false;}
function stopCamera(){if(timer){clearInterval(timer);timer=null;}if(stream){try{stream.getTracks().forEach(function(t){t.stop();});}catch(e){}stream=null;}video.srcObject=null;}
function frameData(){try{if(!video.videoWidth||!video.videoHeight)return '';var scale=Math.min(720/video.videoWidth,540/video.videoHeight,1);canvas.width=Math.max(1,Math.round(video.videoWidth*scale));canvas.height=Math.max(1,Math.round(video.videoHeight*scale));ctx.drawImage(video,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.62);}catch(e){return '';}}
function closeScanner(){closed=true;stopCamera();var sent=sendToParent({type:flow==='dh'?'DH_SCAN_DONE':'QR_SCAN_DONE',ts:Date.now()});status(sent?'Scanner ditutup. Kembali ke halaman absensi…':'Scanner berhenti. Kembali ke halaman sebelumnya.','ok');setTimeout(function(){try{window.close();}catch(e){}},250);}
async function startCamera(){stopCamera();closed=false;busy=false;
 document.getElementById('startBtn').disabled=true;status('Meminta akses kamera…');
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){document.getElementById('startBtn').disabled=false;status('Browser ini tidak menyediakan akses kamera. Pastikan URL memakai HTTPS dan buka melalui Chrome terbaru.','err');tipEl.textContent='Jika URL sudah HTTPS dan masih gagal, periksa izin Kamera untuk situs appdhcimone.github.io di pengaturan situs Chrome.';return;}
 try{
  var constraints={audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}};
  stream=await navigator.mediaDevices.getUserMedia(constraints);video.srcObject=stream;
  await new Promise(function(resolve,reject){var timeout=setTimeout(function(){reject(new Error('Kamera tidak menampilkan gambar.'))},10000);video.onloadedmetadata=function(){video.play().then(function(){clearTimeout(timeout);resolve();}).catch(function(e){clearTimeout(timeout);reject(e);});};});
  status('Kamera siap. Arahkan QR siswa ke kotak hijau.','ok');tipEl.textContent='Jika kartu terbaca, hasilnya akan dikirim kembali ke menu absensi. Kamera tetap aktif untuk antrean berikutnya.';document.getElementById('startBtn').textContent='↻ Mulai Ulang';document.getElementById('startBtn').disabled=false;beginDecode();
 }catch(e){stopCamera();document.getElementById('startBtn').disabled=false;var name=e&&e.name||'Error';status('Kamera gagal dibuka — '+name+(e&&e.message?': '+e.message:''),'err');if(name==='NotAllowedError'||name==='PermissionDeniedError'){tipEl.textContent='Akses ditolak pada situs scanner mandiri. Di Chrome, buka ikon pengaturan situs di samping alamat URL → Izin → Kamera → Izinkan, kemudian muat ulang halaman. Pastikan izin Kamera Chrome juga aktif pada pengaturan Android.';}else if(name==='NotReadableError'){tipEl.textContent='Kamera sedang dipakai aplikasi lain atau tidak bisa dibuka. Tutup aplikasi Kamera/WhatsApp/QR lain lalu coba lagi.';}else{tipEl.textContent='Pastikan izin kamera diaktifkan, tutup aplikasi lain yang memakai kamera, lalu tekan Buka Kamera lagi.';}}
}
function beginDecode(){
 if('BarcodeDetector'in window){try{decoder=new BarcodeDetector({formats:['qr_code']});}catch(e){decoder=null;}}
 if(decoder){timer=setInterval(async function(){if(busy||closed||video.readyState<video.HAVE_ENOUGH_DATA||!video.videoWidth)return;canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0,canvas.width,canvas.height);try{var hits=await decoder.detect(canvas);if(hits&&hits.length)handleQr(hits[0].rawValue);}catch(e){}},180);return;}
 if(typeof window.jsQR==='function'){startJsQrLoop();return;}
 if(jsqrLoading)return;jsqrLoading=true;status('Memuat mesin pembaca QR…');var script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';script.onload=function(){jsqrLoading=false;startJsQrLoop();status('Kamera siap. Arahkan QR siswa ke kotak hijau.','ok');};script.onerror=function(){jsqrLoading=false;status('Mesin QR gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.','err');};document.head.appendChild(script);
}
function startJsQrLoop(){if(timer)clearInterval(timer);timer=setInterval(function(){if(busy||closed||video.readyState<video.HAVE_ENOUGH_DATA||!video.videoWidth)return;var max=900,scale=Math.min(1,max/video.videoWidth);canvas.width=Math.max(1,Math.round(video.videoWidth*scale));canvas.height=Math.max(1,Math.round(video.videoHeight*scale));ctx.drawImage(video,0,0,canvas.width,canvas.height);try{var image=ctx.getImageData(0,0,canvas.width,canvas.height);var hit=window.jsQR(image.data,image.width,image.height,{inversionAttempts:'attemptBoth'});if(hit&&hit.data)handleQr(hit.data);}catch(e){}},180);}
function handleQr(raw){var value=String(raw||'').trim();if(!value||busy||closed)return;var now=Date.now();if(recent[value]&&now-recent[value]<2500)return;recent[value]=now;lastScanAt=now;busy=true;
 var sent=false;
 if(flow==='dh'){var payload={type:'DH_QR_SCAN_RESULT',nisn:value,ts:now,captureDataUrl:frameData()};sendToParent({type:'DH_SCAN_DETECTED',ts:now});sent=sendToParent(payload);}
 else sent=sendToParent({type:'QR_SCAN_RESULT',nisn:value,ts:now});
 if(sent){status('QR terbaca: '+value+'. Mengirim ke aplikasi absensi…','ok');}
 else{status('Scanner tidak terhubung ke halaman absensi. Tutup halaman ini, lalu buka kamera dari tombol di aplikasi utama (jangan membuka scanner.html langsung).','err');tipEl.textContent='Jika halaman dibuka dari APK, pastikan builder membuka halaman scanner sebagai jendela baru yang tetap terhubung dengan halaman pemanggil. Jika terbuka di browser terpisah, hasil scan tidak dapat dikirim kembali otomatis.';busy=false;}
}
window.addEventListener('message',function(e){var d=e.data||{};if(d.type==='DH_SCAN_SUCCESS'){status('✅ Berhasil: '+(d.nama||'Siswa')+(d.jam?' · '+d.jam:'')+'. Silakan scan berikutnya.','ok');busy=false;return;}if(d.type==='DH_SCAN_ERROR'){status('❌ '+(d.message||'Absensi gagal.'),'err');busy=false;return;}if(d.type==='SCAN_SUCCESS'){status('✅ Masuk antrean: '+(d.nama||'Siswa')+'. Silakan scan berikutnya.','ok');busy=false;return;}if(d.type==='SCAN_DUPLICATE'){status('⚠️ Sudah ada di antrean: '+(d.nama||'Siswa'),'err');busy=false;return;}if(d.type==='SCAN_ERROR'){status('❌ '+(d.message||'NISN tidak ditemukan.'),'err');busy=false;}});
document.getElementById('startBtn').addEventListener('click',startCamera);
document.getElementById('switchBtn').addEventListener('click',function(){facing=facing==='environment'?'user':'environment';startCamera();});
document.getElementById('doneBtn').addEventListener('click',closeScanner);
window.addEventListener('pagehide',stopCamera);window.addEventListener('beforeunload',stopCamera);
// Kamera sengaja dimulai setelah tombol diklik agar pengguna dapat memberi izin dengan gesture yang jelas.
})();
</script>
</body></html>
